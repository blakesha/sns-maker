<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword &amp; Sorcery Companion</title>
<style>
:root{--bg:#14110f;--panel:#1f1a16;--panel2:#2a231d;--line:#3d332a;--text:#efe6d8;--mute:#a69884;--gold:#d4a24c;--red:#c75d45;--green:#79ad72;--blue:#6a9cc6;--purple:#a37fc4;--teal:#5fb0a6;--tan:#c9a878;--grey:#9a9a9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:680px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
header.top h1{font:600 19px/1.2 Georgia,"Times New Roman",serif;margin:0;flex:1;color:var(--gold);letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11px;color:var(--mute);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
.btn.pri{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:600}
.btn.dng{border-color:var(--red);color:#f0b3a6}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px}
.btn.ic{width:44px;padding:0;font-size:20px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.card h2{font:600 13px/1 system-ui;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.mute{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px}
.stp button{width:40px;height:40px;border:0;background:#372d24;border-radius:9px;font-size:22px}
.stp input{width:100%;min-width:0;text-align:center;background:transparent;border:0;color:var(--text);font:600 20px system-ui;padding:0}
.lbl{font-size:12px;color:var(--mute);margin:0 0 4px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--grey);border-radius:10px;padding:9px 11px;min-height:56px;width:100%}
.tile b{font-weight:600;font-size:15px}
.tile small{color:var(--mute);font-size:12px}
.tile.empty{border-style:dashed;border-left-width:1px;color:var(--mute);justify-content:center;align-items:center;background:transparent}
.c-characters{border-left-color:var(--gold)}.c-weapons{border-left-color:var(--red)}.c-armors{border-left-color:var(--blue)}
.c-artefacts{border-left-color:var(--purple)}.c-skills{border-left-color:var(--green)}.c-inventory{border-left-color:var(--tan)}
.c-companions{border-left-color:var(--teal)}.c-special{border-left-color:var(--grey)}
.list{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#372d24;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:13px}
.chip.on{border-color:var(--gold)}
.badge{background:var(--gold);color:#1b1408;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px}
.tog{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.tog i{width:42px;height:24px;border-radius:99px;background:#463b31;position:relative;transition:.15s}
.tog i:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#d8cdbb;transition:.15s}
.tog.on i{background:var(--gold)}.tog.on i:after{left:21px;background:#1b1408}
select,input[type=text],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
textarea{min-height:90px;resize:vertical}
.fallen .tile.hero{opacity:.55}
.hero-t{border-left-color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:680px;max-height:88vh;overflow:auto;padding:14px 14px 28px}
.sheet h3{margin:0 0 10px;font:600 18px Georgia,serif;color:var(--gold)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tab{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.tab.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
.trow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.trow .n{flex:1}.trow .v{min-width:30px;text-align:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw}
.empty-msg{text-align:center;color:var(--mute);padding:26px 8px}
.note{font-size:12px;color:var(--mute);line-height:1.5}
a{color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" style="display:none"></div>

function defState(){return{v:1,_t:0,settings:{maxInv:8,maxSkills:6},names:{},custom:[],games:[]}}
function normalize(s){
  var d=defState();if(!s||typeof s!=="object")return d;
  d.settings.maxInv=Math.max(1,+(s.settings&&s.settings.maxInv)||8);
  d.settings.maxSkills=Math.max(1,+(s.settings&&s.settings.maxSkills)||6);
  d.names=(s.names&&typeof s.names==="object")?s.names:{};
  d.custom=Array.isArray(s.custom)?s.custom:[];
  d.games=Array.isArray(s.games)?s.games:[];
  d._t=+s._t||0;
  d.games.forEach(function(g){
    g.id=g.id||uid();g.name=g.name||"Untitled";g.soul=+g.soul||0;g.notes=g.notes||"";g.created=g.created||"";
    g.stash=Array.isArray(g.stash)?g.stash:[];g.chars=Array.isArray(g.chars)?g.chars:[];
    g.chars.forEach(function(c){
      c.skills=c.skills||[];c.inv=c.inv||[];c.tokens=c.tokens||[];
      c.form=+c.form||0;c.gold=+c.gold||0;c.dmg=+c.dmg||0;c.shield=+c.shield||0;c.rank=+c.rank||0;
      c.turn=!!c.turn;c.alive=c.alive!==false;
    });
  });
  return d;
}

function queueSave(){S._t=Date.now();saveLocal();dirty=true;if(dbDoc)setStatus("saving");clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(saving||!dirty)return;
  if(!dbDoc){dirty=false;return}
  saving=true;dirty=false;
  try{
    var j=JSON.stringify(S);
    if(j.length>240000){toast("Data is getting large; export a backup");}
    await dbDoc.set({json:j,t:S._t});
    setStatus("saved");
  }catch(e){setStatus("local");}
  saving=false;
  if(dirty)flush();
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    var r=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    var user=r[0],db=r[1];
    if(!user||!db)return;
    var id=await user.id();if(!id)return;
    var ref=db.collection("data/users/"+id).doc("state");
    var snap=await Promise.race([ref.get(),new Promise(function(_,rej){setTimeout(function(){rej("timeout")},10000)})]);
    dbDoc=ref;
    if(snap.exists){
      var d=snap.data()||{};var rt=+d.t||0;
      if(rt>(S._t||0)){try{S=normalize(JSON.parse(d.json));S._t=rt;saveLocal();render()}catch(e){}}
      else if((S._t||0)>rt){dirty=true;flush()}
    }else if(S.games.length||S.custom.length){dirty=true;flush()}
    setStatus("saved");
  }catch(e){dbDoc=null;setStatus("local")}
}

/* ---------- token logic ---------- */
function placeToken(list,t,add,game,ch){
  var d=TM[t];if(!d)return;
  var fi=list.findIndex(function(x){return x.t===t}),f=fi>=0?list[fi]:null;
  switch(d.b){
    case 0:if(add&&!f)list.push({t:t,c:1});else if(!add&&f)list.splice(fi,1);break;
    case 1:if(add)list.push({t:t,c:1});else{var i=list.findIndex(function(x){return x.t===t});if(i>=0)list.splice(i,1)}break;
    case 2:case 3:
      if(f){f.c+=add?1:-1;if(f.c===0)list.splice(fi,1)}
      else if(add)list.push({t:t,c:1});
      else if(d.b===2)list.push({t:t,c:-1});
      break;
    case 4:
      if(add&&!f){var si=list.findIndex(function(x){return x.t===d.s});if(si>=0)list.splice(si,1);list.push({t:t,c:1})}
      else if(!add&&f)list.splice(fi,1);
      break;
    case 5:
      if(add&&!f){
        if(game&&ch)game.chars.forEach(function(o){if(o!==ch)o.tokens=o.tokens.filter(function(x){return x.t!==t})});
        list.push({t:t,c:1});
      }else if(!add&&f)list.splice(fi,1);
      break;
  }
  list.sort(function(a,b){return a.t-b.t});
}

function getCard(loc){
  var g=curGame(),ch=curChar();if(!g)return null;
  switch(loc.k){
    case"char":return ch&&ch.card;case"main":return ch&&ch.main;case"sec":return ch&&ch.sec;
    case"armor":return ch&&ch.armor;case"art":return ch&&ch.art;
    case"skills":return ch&&ch.skills[loc.i];case"inv":return ch&&ch.inv[loc.i];
    case"stash":return g.stash[loc.i];
  }
  return null;
}
function takeCard(loc){
  var g=curGame(),ch=curChar();
  switch(loc.k){
    case"main":ch.main=null;break;case"sec":ch.sec=null;break;case"armor":ch.armor=null;break;case"art":ch.art=null;break;
    case"skills":ch.skills.splice(loc.i,1);break;case"inv":ch.inv.splice(loc.i,1);break;case"stash":g.stash.splice(loc.i,1);break;
  }
}
function placeInChar(ch,card){
  var c=card.cat;
  if(c==="weapons"){if(!ch.main){ch.main=card;return true}if(!ch.sec){ch.sec=card;return true}}
  else if(c==="armors"&&!ch.armor){ch.armor=card;return true}
  else if(c==="artefacts"&&!ch.art){ch.art=card;return true}
  else if(c==="skills"){if(ch.skills.length<S.settings.maxSkills){ch.skills.push(card);return true}return false}
  if(ch.inv.length<S.settings.maxInv){ch.inv.push(card);return true}
  return false;
}

  else h+='<div class="list">'+g.chars.map(function(c,i){
    var st=(c.turn?"▶ turn · ":"")+(c.alive?"":"fallen · ")+"damage "+c.dmg+" · shield "+c.shield+" · gold "+c.gold;
    return'<div class="'+(c.alive?"":"fallen")+'"><button class="tile hero c-characters" data-act="openChar" data-i="'+i+'"><b>'+esc(nameOf("characters",c.card.id))+"</b><small>"+esc(st)+"</small>"+(c.tokens.length?'<span class="chips">'+c.tokens.map(tokChip).join("")+"</span>":"")+"</button></div>";
  }).join("")+"</div>";
  h+="</div>";
  h+='<div class="card"><h2>Stash <button class="btn sm" data-act="addStash">+ Add card</button></h2>';
  h+=g.stash.length?'<div class="list">'+g.stash.map(function(c,i){return cardTile(c,{k:"stash",i:i})}).join("")+"</div>":'<div class="mute">Shared storage for cards not on a hero.</div>';
  h+="</div>";
  h+='<div class="card"><h2>Notes</h2><textarea data-on="notes" placeholder="Quest log, party notes…">'+esc(g.notes)+"</textarea></div>";
  h+='<div class="row wrap"><button class="btn sm" data-act="renameGame">Rename game</button><button class="btn sm dng" data-act="askDelGame">Delete game</button></div>';
  return h;
}
function viewChar(){
  var g=curGame(),c=curChar();if(!g||!c){nav={v:"games"};return viewGames()}
  var nm=nameOf("characters",c.card.id);
  var h=topbar(nm,true);
  h+='<div class="'+(c.alive?"":"fallen")+'">';
  h+='<div class="card"><h2>Hero</h2><div class="list">'+cardTile(c.card,{k:"char"},hasBack("characters",c.card.id)?"tap to flip side":"")+"</div>";
  h+='<div style="margin-top:10px"><p class="lbl">Form</p><select data-on="form">'+FORMS.map(function(f,i){return'<option value="'+i+'"'+(i===c.form?" selected":"")+">"+f+"</option>"}).join("")+"</select></div>";
  if(FORM_CARDS[c.form])h+='<div class="chips" style="margin-top:8px">'+FORM_CARDS[c.form].map(function(id){return'<span class="chip c-special">'+esc(nameOf("special",id))+"</span>"}).join("")+"</div>";
  h+="</div>";
  h+='<div class="card"><h2>Status</h2><div class="grid2"><div><p class="lbl">Damage</p>'+stepper("c.dmg",c.dmg)+'</div><div><p class="lbl">Magic shield</p>'+stepper("c.shield",c.shield)+'</div><div><p class="lbl">Gold</p>'+stepper("c.gold",c.gold)+'</div><div><p class="lbl">Soul rank</p>'+stepper("c.rank",c.rank)+"</div></div>";
  h+='<div class="grid2" style="margin-top:10px"><button class="tog'+(c.turn?" on":"")+'" data-act="toggle" data-f="turn"><span>Active turn</span><i></i></button><button class="tog'+(c.alive?"":" on")+'" data-act="toggle" data-f="alive"><span>Fallen</span><i></i></button></div></div>';
  h+='<div class="card"><h2>Status effects <button class="btn sm" data-act="tokens">Edit</button></h2>'+(c.tokens.length?'<div class="chips">'+c.tokens.map(tokChip).join("")+"</div>":'<div class="mute">None active.</div>')+"</div>";
  h+='<div class="card"><h2>Equipment</h2><div class="grid2">'+
    slot(c.main,"main","Main hand","weapons")+slot(c.sec,"sec","Off hand","weapons")+slot(c.armor,"armor","Armour","armors")+slot(c.art,"art","Artefact","artefacts")+"</div></div>";
  h+='<div class="card"><h2>Skills <span>'+c.skills.length+"/"+S.settings.maxSkills+' <button class="btn sm" data-act="addList" data-s="skills">+ Add</button></span></h2>';
  h+=c.skills.length?'<div class="list">'+c.skills.map(function(k,i){return cardTile(k,{k:"skills",i:i})}).join("")+"</div>":'<div class="mute">No skills.</div>';
  h+="</div>";
  h+='<div class="card"><h2>Inventory <span>'+c.inv.length+"/"+S.settings.maxInv+' <button class="btn sm" data-act="addList" data-s="inv">+ Add</button></span></h2>';
  h+=c.inv.length?'<div class="list">'+c.inv.map(function(k,i){return cardTile(k,{k:"inv",i:i})}).join("")+"</div>":'<div class="mute">Empty.</div>';
  h+="</div>";
  h+='<button class="btn sm dng" data-act="askDelChar">Remove hero from game</button></div>';
  return h;
  function slot(card,k,label,cat){
    return card?'<div><p class="lbl">'+label+"</p>"+cardTile(card,{k:k})+"</div>":'<div><p class="lbl">'+label+'</p><button class="tile empty" data-act="pickslot" data-s="'+k+'" data-cat="'+cat+'">+ Choose</button></div>';
  }
}

/* ---------- sheets ---------- */
function pickItems(){
  var q=sheet.q.trim().toLowerCase(),g=curGame(),cats=sheet.cat==="all"?sheet.cats:[sheet.cat];
  var have={};g.chars.forEach(function(c){have[c.card.id]=1});
  var out=[];
  cats.forEach(function(cat){
    var arr=(CAT[cat]||[]).concat(S.custom.filter(function(c){return c.cat===cat}));
    arr.forEach(function(it){
      if(cat==="characters"&&have[it.id])return;
      var n=nameOf(cat,it.id);
      if(!q||n.toLowerCase().indexOf(q)>=0)out.push({cat:cat,id:it.id,nm:n});
    });
  });
  out.sort(function(a,b){return a.nm.localeCompare(b.nm)});
  return out;
}
function pickListHtml(){
  var items=pickItems(),shown=items.slice(0,80);
  if(!items.length)return'<div class="empty-msg" style="padding:14px">No matches.</div>';
  return shown.map(function(it){
    return'<button class="tile c-'+it.cat+'" data-act="pickAdd" data-cat="'+it.cat+'" data-id="'+esc(it.id)+'" style="margin-bottom:8px"><b>'+esc(it.nm)+"</b>"+(sheet.cats.length>1?"<small>"+CATN[it.cat]+"</small>":"")+"</button>";
  }).join("")+(items.length>80?'<div class="mute" style="text-align:center">'+(items.length-80)+" more — type to narrow the list</div>":"");
}
function sheetHtml(){
  if(!sheet)return"";
  var h='<div class="ov" data-act="closeOv"><div class="sheet" role="dialog">';
  var t=sheet.t;
  if(t==="newgame"||t==="renamegame"){
    var g=t==="renamegame"?curGame():null;
    h+="<h3>"+(g?"Rename game":"New game")+'</h3><input type="text" id="ngn" maxlength="60" placeholder="Game name" value="'+esc(g?g.name:"")+'"><div class="row" style="margin-top:12px"><button class="btn grow" data-act="close">Cancel</button><button class="btn pri grow" data-act="'+(g?"doRenameGame":"doNewGame")+'">'+(g?"Save":"Create")+"</button></div>";
  }else if(t==="confirm"){
    h+="<h3>"+esc(sheet.title)+'</h3><p class="mute">'+esc(sheet.msg)+'</p><div class="row"><button class="btn grow" data-act="close">Cancel</button><button class="btn dng grow" data-act="'+sheet.act+'">'+esc(sheet.label||"Delete")+"</button></div>";
  }else if(t==="pick"){
    h+="<h3>"+esc(sheet.title)+"</h3>";
    if(sheet.cats.length>1)h+='<div class="tabs"><button class="tab'+(sheet.cat==="all"?" on":"")+'" data-act="tab" data-c="all">All</button>'+sheet.cats.map(function(c){return'<button class="tab'+(sheet.cat===c?" on":"")+'" data-act="tab" data-c="'+c+'">'+CATN[c]+"</button>"}).join("")+"</div>";
    h+='<input type="text" id="pq" data-on="q" placeholder="Search…" value="'+esc(sheet.q)+'" autocomplete="off" style="margin-bottom:10px"><div id="pl">'+pickListHtml()+"</div>";
    var cc=sheet.cat==="all"?sheet.cats[0]:sheet.cat;
    h+='<div class="card" style="margin-bottom:0"><h2>Add your own '+esc(CATN[cc].toLowerCase())+' card</h2><div class="row"><input type="text" id="cn" maxlength="60" placeholder="Card name"><button class="btn" data-act="customAdd" data-c="'+cc+'">Add</button></div></div>';
  }else if(t==="card"){
    var k=getCard(sheet.loc);if(!k){return""}
    var nm=nameOf(k.cat,k.id);
    h+="<h3>"+esc(nm)+'</h3><p class="mute" style="margin:-6px 0 10px">'+CATN[k.cat]+(k.flipped?" · flipped":"")+"</p>";
    h+='<div class="row wrap" style="margin-bottom:10px">'+(hasBack(k.cat,k.id)?'<button class="btn" data-act="flip">Flip card</button>':"")+'<button class="btn" data-act="renameCard">Rename</button></div>';
    h+='<p class="lbl">Counters</p>'+stepper("k.counters",k.counters);
    h+='<p class="lbl" style="margin-top:12px">Tokens on this card</p>'+tokenRows(k.tokens);
    if(sheet.loc.k!=="char"){
      h+='<div class="row wrap" style="margin-top:14px">'+(sheet.loc.k==="stash"?'<button class="btn" data-act="moveToChar">Give to hero…</button>':'<button class="btn" data-act="toStash">Move to stash</button>')+'<button class="btn dng" data-act="removeCard">Discard</button></div>';
    }
    h+='<div style="margin-top:14px"><button class="btn pri" style="width:100%" data-act="close">Done</button></div>';
  }else if(t==="rename"){
    h+="<h3>Rename card</h3>"+'<input type="text" id="rn" maxlength="60" value="'+esc(sheet.cur)+'"><p class="note">Leave empty to restore the default label.</p><div class="row"><button class="btn grow" data-act="close">Cancel</button><button class="btn pri grow" data-act="doRename">Save</button></div>';
  }else if(t==="tokens"){
    var c=curChar();
    h+="<h3>Status effects</h3>"+tokenRows(c.tokens)+'<div style="margin-top:14px"><button class="btn pri" style="width:100%" data-act="close">Done</button></div>';
  }else if(t==="moveto"){
    var g2=curGame();
    h+="<h3>Give to which hero?</h3>"+(g2.chars.length?'<div class="list">'+g2.chars.map(function(c,i){return'<button class="tile c-characters" data-act="doMove" data-i="'+i+'"><b>'+esc(nameOf("characters",c.card.id))+"</b></button>"}).join("")+"</div>":'<div class="mute">Add a hero first.</div>')+'<div style="margin-top:12px"><button class="btn" style="width:100%" data-act="close">Cancel</button></div>';
  }else if(t==="backup"){
    var json=JSON.stringify(S);
    h+="<h3>Backup & restore</h3>"+'<p class="note">Your games save automatically (to your account when available, and to this device). Export a copy now and then.</p>';
    h+='<div class="row wrap"><button class="btn pri" data-act="exportFile">Save file</button><button class="btn" data-act="copyJson">Copy data</button></div>';
    h+='<p class="lbl" style="margin-top:16px">Restore from a backup</p><textarea id="imp" placeholder="Paste backup data here"></textarea><div class="row" style="margin-top:8px"><input type="file" id="impf" accept=".json,application/json" style="color:var(--mute);flex:1;min-width:0"><button class="btn dng" data-act="doImport">Restore</button></div><p class="note">Restoring replaces everything currently stored.</p>';
    h+='<div style="margin-top:14px"><button class="btn" style="width:100%" data-act="close">Close</button></div><textarea id="expdata" style="display:none">'+esc(json)+"</textarea>";
  }
  return h+"</div></div>";
}
function tokenRows(list){
  return TOK.map(function(d){
    var f=list.find(function(x){return x.t===d.t});
    return'<div class="trow"><span>'+d.i+'</span><span class="n">'+esc(d.l)+'</span><button class="btn sm ic" style="width:40px" data-act="tok" data-t="'+d.t+'" data-d="-1">−</button><span class="v">'+(f?(d.b===0||d.b===4||d.b===5?"✓":f.c):"·")+'</span><button class="btn sm ic" style="width:40px" data-act="tok" data-t="'+d.t+'" data-d="1">+</button></div>';
  }).join("");
}
function renderSheet(){
  var el=$("#sheet"),y=el.querySelector(".sheet")?el.querySelector(".sheet").scrollTop:0;
  el.innerHTML=sheetHtml();
  var s=el.querySelector(".sheet");if(s)s.scrollTop=y;
}
function render(){
  var h=nav.v==="game"?viewGame():nav.v==="char"?viewChar():viewGames();
  var y=window.scrollY;
  $("#app").innerHTML=h;window.scrollTo(0,y);
  renderSheet();
}
var tt;
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(function(){t.style.display="none"},2600)}
function openPick(slot,title,cats){sheet={t:"pick",slot:slot,title:title,cats:cats,cat:cats.length>1?"all":cats[0],q:""};renderSheet()}

/* ---------- fields ---------- */
function fieldRef(f){
  if(f==="g.soul")return[curGame(),"soul",0];
  if(f.indexOf("c.")===0)return[curChar(),f.slice(2),0];
  if(f==="s.maxSkills")return[S.settings,"maxSkills",1];
  if(f==="s.maxInv")return[S.settings,"maxInv",1];
  if(f==="k.counters")return[getCard(sheet.loc),"counters",0];
  return null;
}
function setField(f,val){
  var r=fieldRef(f);if(!r||!r[0])return;
  var n=Math.round(+val);if(!isFinite(n))n=r[0][r[1]];
  r[0][r[1]]=Math.max(r[2],Math.min(9999,n));
}

/* ---------- actions ---------- */
function act(a,el,e){
  var d=el.dataset,g=curGame(),ch=curChar();
  switch(a){
    case"closeOv":if(e.target!==el)return;sheet=null;renderSheet();return;
    case"close":sheet=null;renderSheet();return;
    case"back":if(nav.v==="char")nav={v:"game",gid:nav.gid};else nav={v:"games"};render();window.scrollTo(0,0);return;
    case"newGame":sheet={t:"newgame"};renderSheet();setTimeout(function(){var i=$("#ngn");if(i)i.focus()},50);return;
    case"doNewGame":{var n=($("#ngn").value||"").trim();if(!n){toast("Enter a name");return}
      var ng={id:uid(),name:n,created:new Date().toISOString().slice(0,10),soul:0,notes:"",stash:[],chars:[]};
      S.games.unshift(ng);nav={v:"game",gid:ng.id};sheet=null;commit();window.scrollTo(0,0);return}
    case"renameGame":sheet={t:"renamegame"};renderSheet();return;
    case"doRenameGame":{var n2=($("#ngn").value||"").trim();if(!n2){toast("Enter a name");return}g.name=n2;sheet=null;commit();return}
    case"openGame":nav={v:"game",gid:d.gid};render();window.scrollTo(0,0);return;
    case"openChar":nav={v:"char",gid:nav.gid,ci:+d.i};render();window.scrollTo(0,0);return;
    case"askDelGame":sheet={t:"confirm",title:"Delete this game?",msg:"All heroes, cards and notes in “"+g.name+"” will be removed.",act:"delGame"};renderSheet();return;
    case"delGame":S.games=S.games.filter(function(x){return x.id!==g.id});nav={v:"games"};sheet=null;commit();return;
    case"askDelChar":sheet={t:"confirm",title:"Remove hero?",msg:"This removes the hero and everything they carry.",act:"delChar",label:"Remove"};renderSheet();return;
    case"delChar":g.chars.splice(nav.ci,1);nav={v:"game",gid:g.id};sheet=null;commit();return;
    case"step":{var r=fieldRef(d.f);if(!r||!r[0])return;setField(d.f,r[0][r[1]]+ +d.d);commit();return}
    case"toggle":ch[d.f]=!ch[d.f];if(d.f==="turn"&&ch.turn)g.chars.forEach(function(o){if(o!==ch)o.turn=false});commit();return;
    case"nextTurn":{var n3=g.chars.length,cur=g.chars.findIndex(function(c){return c.turn}),k=cur;
      for(var s=1;s<=n3;s++){var j=(cur+s+n3)%n3;if(g.chars[j].alive){k=j;break}}
      g.chars.forEach(function(c,i){c.turn=i===k});commit();return}
    case"addChar":openPick("char","Add a hero",["characters"]);return;
    case"addStash":openPick("stash","Add to stash",["weapons","armors","artefacts","skills","inventory","companions"]);return;
    case"addList":
      if(d.s==="skills"){if(ch.skills.length>=S.settings.maxSkills){toast("Skill slots are full");return}openPick("skills","Add a skill",["skills"])}
      else{if(ch.inv.length>=S.settings.maxInv){toast("Inventory is full");return}openPick("inv","Add to inventory",["inventory","companions"])}
      return;
    case"pickslot":openPick(d.s,"Choose a card",[d.cat]);return;
    case"tab":sheet.cat=d.c;renderSheet();return;
    case"pickAdd":addPicked(d.cat,d.id);return;
    case"customAdd":{var nmv=($("#cn").value||"").trim();if(!nmv){toast("Enter a card name");return}
      var cid="c_"+uid();S.custom.push({cat:d.c,id:cid,name:nmv});addPicked(d.c,cid);return}
    case"card":sheet={t:"card",loc:{k:d.k,i:d.i===""?null:+d.i}};renderSheet();return;
    case"flip":{var k=getCard(sheet.loc);k.flipped=!k.flipped;commit();return}
    case"renameCard":{var k2=getCard(sheet.loc);sheet={t:"rename",loc:sheet.loc,cur:S.names[k2.cat+"/"+k2.id]||nameOf(k2.cat,k2.id)};renderSheet();return}
    case"doRename":{var k3=getCard(sheet.loc),v=($("#rn").value||"").trim(),key=k3.cat+"/"+k3.id;
      if(v&&v!==pretty(k3.cat,k3.id))S.names[key]=v;else delete S.names[key];
      sheet={t:"card",loc:sheet.loc};commit();return}
    case"tok":{var list=sheet.t==="tokens"?ch.tokens:getCard(sheet.loc).tokens;
      placeToken(list,+d.t,+d.d>0,sheet.t==="tokens"?g:null,sheet.t==="tokens"?ch:null);commit();return}
    case"tokens":sheet={t:"tokens"};renderSheet();return;
    case"toStash":{var cd=getCard(sheet.loc);takeCard(sheet.loc);g.stash.push(cd);sheet=null;commit();toast("Moved to stash");return}
    case"removeCard":takeCard(sheet.loc);sheet=null;commit();return;
    case"moveToChar":sheet={t:"moveto",loc:sheet.loc};renderSheet();return;
    case"doMove":{var tc=g.chars[+d.i],card=getCard(sheet.loc);
      if(placeInChar(tc,card)){g.stash.splice(sheet.loc.i,1);sheet=null;commit();toast("Given to "+nameOf("characters",tc.card.id))}
      else{toast("No room on that hero")}return}
    case"backup":sheet={t:"backup"};renderSheet();return;
    case"exportFile":exportFile();return;
    case"copyJson":copyJson();return;
    case"doImport":doImport();return;
  }
}
function addPicked(cat,id){
  var g=curGame(),ch=curChar(),s=sheet.slot,card=mkCard(cat,id);
  if(s==="char"){g.chars.push(mkChar(id));if(g.chars.length===1)g.chars[0].turn=true}
  else if(s==="stash")g.stash.push(card);
  else if(s==="main")ch.main=card;else if(s==="sec")ch.sec=card;else if(s==="armor")ch.armor=card;else if(s==="art")ch.art=card;
  else if(s==="skills"){if(ch.skills.length>=S.settings.maxSkills){toast("Skill slots are full");return}ch.skills.push(card)}
  else if(s==="inv"){if(ch.inv.length>=S.settings.maxInv){toast("Inventory is full");return}ch.inv.push(card)}
  sheet=null;commit();
}
async function exportFile(){
  var data=JSON.stringify(S,null,1);
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(!dl){toast("Saving files isn't available here — use Copy data");return}
    await dl.save({filename:"sword-sorcery-companion-backup.json",data:data});
    toast("Backup saved");
  }catch(e){if(!e||e.code!=="declined")toast("Couldn't save the file — use Copy data")}
}
async function copyJson(){
  var t=$("#expdata").value;
  try{await navigator.clipboard.writeText(t);toast("Copied to clipboard")}
  catch(e){var x=$("#expdata");x.style.display="block";x.style.height="120px";x.select();toast("Select and copy the text shown")}
}
function applyImport(text){
  var o;try{o=JSON.parse(text)}catch(e){toast("That isn't valid backup data");return}
  if(!o||!Array.isArray(o.games)){toast("No games found in that data");return}
  S=normalize(o);sheet=null;nav={v:"games"};commit();toast("Restored "+S.games.length+" game"+(S.games.length===1?"":"s"));
}
function doImport(){
  var f=$("#impf")&&$("#impf").files&&$("#impf").files[0],t=($("#imp").value||"").trim();
  if(f){var rd=new FileReader();rd.onload=function(){applyImport(String(rd.result))};rd.readAsText(f);return}
  if(!t){toast("Paste data or choose a file");return}
  applyImport(t);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  act(el.dataset.act,el,e);
});
function onInput(e){
  var el=e.target;if(!el.dataset||!el.dataset.on)return;
  var on=el.dataset.on;
  if(on==="q"&&e.type==="input"){sheet.q=el.value;var pl=$("#pl");if(pl)pl.innerHTML=pickListHtml()}
  else if(on==="notes"&&e.type==="input"){var g=curGame();if(g){g.notes=el.value;queueSave()}}
  else if(on==="num"&&e.type==="change"){setField(el.dataset.f,el.value);commit()}
  else if(on==="form"&&e.type==="change"){var c=curChar();if(c){c.form=+el.value;commit()}}
}
document.addEventListener("input",onInput);
document.addEventListener("change",onInput);

loadLocal();render();initCloud();
})();
</script>
</body>
</html>
